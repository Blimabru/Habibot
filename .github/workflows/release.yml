name: Build & Release (v minúsculo)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Baixar Código
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: 📦 Instalar Dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Compilar Executável
        run: |
          # Gera o ícone .ico a partir do png
          python tools/make_windows_ico.py
          
          # Compila usando o arquivo de versão
          pyinstaller --onefile --windowed --icon="assets/images/icons/Habibot.ico" --version-file="assets/build/version_info.txt" --name "Habibot_${{ github.ref_name }}" habibot.py

      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Habibot_${{ github.ref_name }}.exe
